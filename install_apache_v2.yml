---

- hosts: all
  become: true
  tasks:

  - name: update repository index
    ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: install apache2 package
    ansible.builtin.apt:
      name: apache2
      state: present
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: add php support for apache
    ansible.builtin.apt:
      name: libapache2-mod-php
      state: present
    when: ansible_distribution in ["Debian", "Ubuntu"] 

  - name: update repository index
    ansible.builtin.dnf:
      name: "*"
      state: latest

  - name: install apache2 package
    ansible.builtin.dnf:
      name: httpd
      state: present

  - name: add php support for apache
    ansible.builtin.dnf:
      name: php
      state: present

---

- hosts: all
  become: true
  tasks:

  - name: install apache2 and php packages
    ansible.builtin.apt:
      name: 
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
      cache_valid_time: 3600
    when: ansible_distribution in ["Debian", "Ubuntu"]

  - name: install apache2 and php packages
    ansible.builtin.dnf:
      name: 
        - httpd
        - php
      state: latest
      update_cache: yes


---

- hosts: all
  become: true
  pre_tasks:

  - name: Install updates (Rocky/Alma)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution in ['AlmaLinux', 'Rocky']

  - name: Install updates (Debian)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Debian"

- hosts: all
  become: true
  tasks:

  - name: Create simone user
    tags: always
    user:
      name: simone
      groups: root

  - name: add ssh key for simone
    tags: always
    authorized_key:
      user: simone
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHaW7jIo2m+jNOZPY1cDRi4SmjCgFAXyz72qm27E4f90 ansible"

  - name: add sudoers file for simone
    tags: always
    copy: 
      src: sudoer_simone
      dest: /etc/sudoers.d/simone
      owner: root
      group: root
      mode: 0440


